name: volunteer-replay
on:
  workflow_dispatch:
    inputs:
      target:
        description: Tracker module or packet ID
        required: true
        default: M174963
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout pinned tracker source
        uses: actions/checkout@v4
        with:
          repository: rohanarun/alpoge-rh-replay
          ref: 7cbf7bbb9284236c8ee08ab1f2ba609e0977c334
          path: repo
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 build-essential ca-certificates time
          df -h
          free -h
          nproc
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned volume
        run: |
          cd repo
          ./verify.sh "$RUNNER_TEMP/vol" --prepare-only
          rm -rf "$RUNNER_TEMP/vol/parts"
          du -sh "$RUNNER_TEMP/vol"/* || true
          df -h
      - name: Build claimed target
        run: |
          cd repo
          python3 tracker/tasks.py build "${{ inputs.target }}" "$RUNNER_TEMP/vol/lean" "$RUNNER_TEMP/receipt-${{ inputs.target }}" --fast-bundle
      - name: Verify receipt
        run: |
          cd repo
          python3 tracker/replay_evidence.py verify "${{ inputs.target }}" "$RUNNER_TEMP/receipt-${{ inputs.target }}" --checkout "$RUNNER_TEMP/vol/lean"
      - name: Collect hashes
        run: |
          cd "$RUNNER_TEMP/receipt-${{ inputs.target }}"
          sha256sum receipt.json build.log targets.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ inputs.target }}
          path: ${{ runner.temp }}/receipt-${{ inputs.target }}
          if-no-files-found: error
      - name: Publish evidence release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="replay-${{ inputs.target }}-${{ github.run_id }}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/receipt-${{ inputs.target }}/receipt.json" \
            "$RUNNER_TEMP/receipt-${{ inputs.target }}/build.log" \
            "$RUNNER_TEMP/receipt-${{ inputs.target }}/targets.tar.gz" \
            "$RUNNER_TEMP/receipt-${{ inputs.target }}/SHA256SUMS" \
            --repo "${{ github.repository }}" \
            --title "Replay ${{ inputs.target }} (run ${{ github.run_id }})" \
            --notes "Volunteer build evidence for ${{ inputs.target }} from pinned tracker commit 7cbf7bbb9284236c8ee08ab1f2ba609e0977c334."
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"